[package]
name = "ovrd"
description = "Server and host agent for ovr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ovr-proto.workspace = true

clap = { workspace = true, features = ["derive"] }
ed25519-dalek.workspace = true
fd-lock.workspace = true
miette = { workspace = true, features = ["fancy"] }
portable-pty.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "fmt", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
