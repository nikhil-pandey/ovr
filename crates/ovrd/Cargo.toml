[package]
name = "ovrd"
description = "Server and host agent for ovr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ovr-proto.workspace = true

base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
futures.workspace = true
gethostname.workspace = true
miette = { workspace = true, features = ["fancy"] }
portable-pty.workspace = true
process-wrap = { workspace = true, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
socket2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "fmt", "std"] }
ureq = { workspace = true, features = ["rustls"] }
yamux.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
