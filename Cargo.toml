[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/nikhil-pandey/ovr"

[workspace.dependencies]
ovr = { path = "crates/ovr", version = "0.2.2" }
ovr-proto = { path = "crates/ovr-proto", version = "0.2.2" }
ovrd = { path = "crates/ovrd", version = "0.2.2" }

bytes = "1.12.1"
clap = "4.6.7"
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
gethostname = "1.1.0"
libc = "0.2.191"
miette = "7.6.0"
nix = "0.31.3"
portable-pty = "0.9.0"
process-wrap = { version = "10.0.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
socket2 = "0.6.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
windows-sys = "0.61.2"
yamux = "0.14.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
