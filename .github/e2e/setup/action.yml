name: e2e setup
description: Install the release build and the tools used by the cross-runner tests.
inputs:
  provider:
    description: Tunnel CLI to install. Trusted hosts install theirs through the public action.
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: e2e-dist
        path: ${{ runner.temp }}/e2e-dist
    # This runner's release archive from the `build` job, onto PATH.
    - shell: bash
      run: |
        bin="$RUNNER_TEMP/ovr-bin"
        bash .github/scripts/install-ovr.sh "$bin" "$RUNNER_TEMP/e2e-dist"
        echo "$bin" >>"$GITHUB_PATH"
    - if: inputs.provider != '' && !(inputs.provider == 'tailcat' && runner.os == 'macOS')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/tunnel-bin
        key: tunnel-${{ inputs.provider }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-tunnel.sh') }}
    - if: inputs.provider != ''
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        bin="$RUNNER_TEMP/tunnel-bin"
        bash .github/scripts/install-tunnel.sh "$PROVIDER" "$bin"
        echo "$bin" >>"$GITHUB_PATH"
