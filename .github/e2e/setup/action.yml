name: e2e setup
description: Builds ovr's binaries onto PATH and installs uv and cloudflared, at the versions the calling workflow sets.
inputs:
  packages:
    description: The Cargo packages to build, such as `-p ovr -p ovrd`
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
    - shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-on-failure: true
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        cargo build --release --locked $PACKAGES
        echo "$GITHUB_WORKSPACE/target/release" >>"$GITHUB_PATH"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cloudflared
        key: cloudflared-${{ runner.os }}-${{ env.CLOUDFLARED_VERSION }}
    - shell: bash
      run: .github/e2e/install-cloudflared.sh
