name: Tunnel e2e

# An initiator on one runner opens a Cloudflare quick tunnel; hosts on Linux, macOS, and Windows runners dial in
# through it, and the initiator syncs real repositories to all three at once and builds or runs them there. The
# job summary reports each runner's specs and every step's time; `.github/e2e/e2e.py` does the work.
#
# Quick tunnel addresses are random, so the jobs meet through this run's artifacts: each host uploads its specs and a
# public key, the initiator answers with `ovrd connect` arguments encrypted to each key, and uploads `finished` at
# the end. Each host also connects as a trusted job of this repository, without pairing, and the initiator checks a
# sync to each.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "standard: four repositories, built on each host. large: adds llvm-project, chromium, and a generated repository, synced and checked on each host."
        type: choice
        options: [standard, large]
        default: standard
      synthetic-gib:
        description: Size of the generated repository in the large tier, in GiB
        default: "10"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tier || 'standard' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"
  TIER: ${{ inputs.tier || 'standard' }}
  # renovate: datasource=github-releases depName=cloudflare/cloudflared
  CLOUDFLARED_VERSION: 2026.10.7
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.7

defaults:
  run:
    shell: bash

jobs:
  initiator:
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    env:
      RUNS_ON: ubuntu-26.04
      REPOS: /mnt/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: |
          cargo build --release --locked -p ovr -p ovrd
          echo "$GITHUB_WORKSPACE/target/release" >>"$GITHUB_PATH"
      - run: .github/e2e/install-cloudflared.sh
      # The repositories go on the runner's larger scratch disk.
      - run: sudo mkdir -p "$REPOS" && sudo chown "$USER" "$REPOS"
      - run: uv run .github/e2e/e2e.py specs --role initiator --disk "$REPOS" --out specs/initiator/specs.json
      - name: Prepare the repositories
        env:
          SYNTHETIC_GIB: ${{ inputs.synthetic-gib || '10' }}
        run: uv run .github/e2e/e2e.py prepare --tier "$TIER" --synthetic-gib "$SYNTHETIC_GIB" --dir "$REPOS"
      - name: Pair the hosts
        run: uv run .github/e2e/e2e.py pair
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairs
          path: pairs
          retention-days: 1
      - name: Wait for the hosts to dial in
        run: uv run .github/e2e/e2e.py hosts
      - name: Sync to every trusted job
        run: uv run .github/e2e/e2e.py trusted
      - name: Sync and run on every host
        run: uv run .github/e2e/e2e.py bench
      - if: always()
        name: Report
        run: uv run .github/e2e/e2e.py report
      - if: always()
        name: Close the tunnel
        run: |
          mkdir -p finished && echo finished >finished/finished
          ovrd tunnel close cloudflare || true
          mkdir -p logs && cp ~/.local/state/ovr/*.log logs/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finished
          path: finished
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: |
            report.md
            repos.json
            hosts.json
            results.json
            specs
            logs
          if-no-files-found: ignore

  host:
    name: host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-26.04 }
          - { name: macos, os: macos-26 }
          - { name: windows, os: windows-2025-vs2026 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
      id-token: write # connects as a trusted job too
    env:
      RUNS_ON: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: |
          cargo build --release --locked -p ovrd
          echo "$GITHUB_WORKSPACE/target/release" >>"$GITHUB_PATH"
      - run: .github/e2e/install-cloudflared.sh
      # OVR_CHECKOUTS puts checkouts on the larger scratch disk on Linux, and on the drive with the most room on
      # Windows, where deep trees also need long paths. The specs measure free space there.
      - if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/ovr && sudo chown "$USER" /mnt/ovr
          echo "OVR_CHECKOUTS=/mnt/ovr" >>"$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, Used, Free
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object Free | Sort-Object Free -Descending | Select-Object -First 1
          $dir = Join-Path $drive.Root ovr
          New-Item -ItemType Directory -Force $dir | Out-Null
          "OVR_CHECKOUTS=$dir" >> $env:GITHUB_ENV
      - name: Publish specs and a key the initiator can encrypt to
        run: |
          mkdir -p "$RUNNER_TEMP/key" key
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/key/key.pem"
          openssl pkey -in "$RUNNER_TEMP/key/key.pem" -pubout -out key/key.pub
          uv run .github/e2e/e2e.py specs --role "${{ matrix.name }} host" --out key/specs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-${{ matrix.name }}
          path: key
          retention-days: 1
      - name: Serve the initiator until it has finished
        run: uv run .github/e2e/e2e.py serve --os "${{ matrix.name }}" --key "$RUNNER_TEMP/key/key.pem"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-log-${{ matrix.name }}
          path: |
            ovrd.log
            ${{ runner.temp }}/ovr-trusted/state/connect-github.log
          if-no-files-found: ignore
