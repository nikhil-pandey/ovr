name: Release

# release-plz keeps a release PR open with the next version and changelog. Merging it tags `v<version>`, and the
# shared dist workflow publishes the Bazel-built binaries, packages, and install scripts to that tag's GitHub release.
# Dispatching it with a `tag` publishes that existing tag again, for example after a failed publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish; leave empty to prepare a release
        type: string
        default: ''
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=release-plz/release-plz extractVersion=^release-plz-v(?<version>.*)$
  RELEASE_PLZ_VERSION: 0.4.3

jobs:
  pr:
    if: github.repository_owner == 'nikhil-pandey' && !inputs.tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    if: github.repository_owner == 'nikhil-pandey' && !inputs.tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.release.outputs.releases_created == 'true'
        run: echo "tag=$(jq -r '.[0].tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.release.outputs.releases }}

  publish:
    needs: tag
    if: >-
      !cancelled() && github.repository_owner == 'nikhil-pandey' &&
      (needs.tag.outputs.tag != '' || inputs.tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/dist.yml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    with:
      ref: ${{ inputs.tag || needs.tag.outputs.tag }}
      publish: true
