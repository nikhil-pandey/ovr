name: Release

# release-plz keeps a release PR open with the next version and changelog. Merging it tags `v<version>`, and
# GoReleaser publishes the binaries, packages, and install scripts to that tag's GitHub release.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=release-plz/release-plz extractVersion=^release-plz-v(?<version>.*)$
  RELEASE_PLZ_VERSION: 0.4.3
  # renovate: datasource=pypi depName=ziglang
  ZIG_VERSION: 0.17.1
  # renovate: datasource=crate depName=cargo-zigbuild
  CARGO_ZIGBUILD_VERSION: 0.24.1
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.0

jobs:
  pr:
    if: github.repository_owner == 'nikhil-pandey'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    if: github.repository_owner == 'nikhil-pandey'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: ${{ env.RELEASE_PLZ_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.release.outputs.releases_created == 'true'
        run: echo "tag=$(jq -r '.[0].tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.release.outputs.releases }}

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      # Shares the cache CI's nightly dist job keeps on main, so a release after a dependency change warms it for
      # pull requests too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: zigbuild
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
