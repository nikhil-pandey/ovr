name: CI

# Pull requests run the full checks, unless they only change Markdown. A nightly run on main only refreshes the caches
# pull requests restore from: Bazel runs its tests and release build too, because it caches actions and test results;
# Cargo only compiles. Merges run nothing here, so they never queue behind each other or crowd out pull requests and
# releases.
on:
  pull_request:
    paths-ignore: ["**/*.md", LICENSE]
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# GitHub scopes caches saved by a pull request to that pull request, so only main's caches are shared, and a branch
# cannot poison them. Pull requests only restore, so their copies do not push main's out of the repository's quota.
jobs:
  # Every platform a release ships for, tested natively.
  cargo:
    name: cargo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel, windows-2025-vs2026, windows-11-vs2026-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'pull_request'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: github.event_name == 'pull_request'
        run: cargo test --workspace --locked
      - if: github.event_name == 'schedule'
        run: |
          cargo clippy --workspace --all-targets --locked
          cargo test --workspace --locked --no-run

  # The release build, exactly as the release workflow runs it, without publishing: Bazel cross-builds every target
  # from Linux with its hermetic Rust and LLVM toolchains.
  dist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: dist
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel build --config=ci --config=release //packaging:dist
      - run: mkdir dist && cp bazel-bin/packaging/dist/* dist/
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          retention-days: 3

  # Installs each release artifact on the OS it targets and runs it.
  smoke:
    name: smoke (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu x64 deb, os: ubuntu-26.04, target: x86_64-unknown-linux-musl, pkg: deb }
          - { name: ubuntu arm64 deb, os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, pkg: deb }
          - name: azure linux x64 rpm
            os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            pkg: rpm
            container: mcr.microsoft.com/azurelinux/base/core:3.0
          - name: azure linux arm64 rpm
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            pkg: rpm
            container: mcr.microsoft.com/azurelinux/base/core:3.0
          - { name: macos arm64, os: macos-26, target: aarch64-apple-darwin, pkg: tar.gz }
          - { name: macos x64, os: macos-26-intel, target: x86_64-apple-darwin, pkg: tar.gz }
          - { name: windows x64, os: windows-2025-vs2026, target: x86_64-pc-windows-gnullvm, pkg: zip }
          - { name: windows arm64, os: windows-11-vs2026-arm, target: aarch64-pc-windows-gnullvm, pkg: zip }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      ASSET: dist/ovr-${{ matrix.target }}.${{ matrix.pkg }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: matrix.pkg == 'deb'
        run: sudo dpkg -i "$ASSET"
      - if: matrix.pkg == 'rpm'
        run: rpm -i "$ASSET"
      - if: matrix.pkg == 'tar.gz'
        run: |
          mkdir bin && tar -xzf "$ASSET" -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          Expand-Archive $env:ASSET bin
          "$PWD\bin" >> $env:GITHUB_PATH
      - run: ovr --version && ovrd --version

  # Bazel on one OS: every test, plus clippy and rustfmt on every Rust target. The cargo jobs cover every platform, and
  # macOS runners are scarce.
  bazel:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: test
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test --config=ci //...
