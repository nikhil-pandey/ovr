name: CI

# Pull requests run the full checks, unless they only change Markdown. Bazel tests and lints on Linux, and cross-builds
# and lints for every other released OS and architecture, whose runners then run the Rust tests from a bundle with no
# toolchain of their own. A nightly run on main only refreshes the caches pull requests restore from: Bazel builds,
# tests, and cross-builds there too, because it caches actions and test results. Merges run nothing here, so they never
# queue behind each other or crowd out pull requests and releases.
on:
  pull_request:
    paths-ignore: ["**/*.md", LICENSE]
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub scopes caches saved by a pull request to that pull request, so only main's caches are shared, and a branch
# cannot poison them. Pull requests only restore, so their copies do not push main's out of the repository's quota.
jobs:
  # Platform-specific code: Linux cross-builds and lints every target for each OS and architecture, then that runner
  # runs the Rust tests from the bundle.
  cross:
    name: cross (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-gnullvm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: cross-${{ matrix.target }}
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: >-
          bazel build --config=ci --config=lint --platforms=@rules_rs//rs/platforms:${{ matrix.target }}
          //... //:rust-test-bundle
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests-${{ matrix.target }}
          path: bazel-bin/rust-test-bundle.tar.gz
          retention-days: 3

  test:
    name: test (${{ matrix.os }})
    needs: cross
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
          - { os: windows-2025-vs2026, target: x86_64-pc-windows-gnullvm }
          - { os: windows-11-vs2026-arm, target: aarch64-pc-windows-gnullvm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-${{ matrix.target }}
      # Each test runs from its runfiles tree, as `bazel test` would run it.
      - run: |
          mkdir tests && tar -xzf rust-test-bundle.tar.gz -C tests && cd tests
          failed=()
          for runfiles in *.runfiles; do
            test=${runfiles%.runfiles}
            echo "::group::$test"
            (cd "$runfiles/_main" && "../../$test") || failed+=("$test")
            echo "::endgroup::"
          done
          if ((${#failed[@]})); then echo "::error::Failed: ${failed[*]}"; exit 1; fi

  # The release build, exactly as the release workflow runs it, without publishing: Bazel cross-builds every target
  # from Linux with its hermetic Rust and LLVM toolchains.
  dist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: dist
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel build --config=ci --config=release //packaging:dist
      - run: mkdir dist && cp bazel-bin/packaging/dist/* dist/
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          retention-days: 3

  # Installs each release artifact on the OS it targets and runs it.
  smoke:
    name: smoke (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu x64 deb, os: ubuntu-26.04, target: x86_64-unknown-linux-musl, pkg: deb }
          - { name: ubuntu arm64 deb, os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, pkg: deb }
          - name: azure linux x64 rpm
            os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            pkg: rpm
            container: mcr.microsoft.com/azurelinux/base/core:3.0
          - name: azure linux arm64 rpm
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            pkg: rpm
            container: mcr.microsoft.com/azurelinux/base/core:3.0
          - { name: macos arm64, os: macos-26, target: aarch64-apple-darwin, pkg: tar.gz }
          - { name: macos x64, os: macos-26-intel, target: x86_64-apple-darwin, pkg: tar.gz }
          - { name: windows x64, os: windows-2025-vs2026, target: x86_64-pc-windows-gnullvm, pkg: zip }
          - { name: windows arm64, os: windows-11-vs2026-arm, target: aarch64-pc-windows-gnullvm, pkg: zip }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      ASSET: dist/ovr-${{ matrix.target }}.${{ matrix.pkg }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: matrix.pkg == 'deb'
        run: sudo dpkg -i "$ASSET"
      - if: matrix.pkg == 'rpm'
        run: rpm -i "$ASSET"
      - if: matrix.pkg == 'tar.gz'
        run: |
          mkdir bin && tar -xzf "$ASSET" -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          Expand-Archive $env:ASSET bin
          "$PWD\bin" >> $env:GITHUB_PATH
      - run: ovr --version && ovrd --version

  # Every test on Linux, plus clippy and rustfmt on every Rust target. Bazel caches test results, so nightly runs also
  # test, and pull requests rerun only what changed.
  bazel:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: test
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test --config=ci //...
