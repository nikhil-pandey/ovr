name: E2E

# Checks that syncs and exit codes reach hosts on Linux, macOS, and Windows through a Cloudflare quick tunnel, both
# paired hosts and trusted ones that connect with the job's OIDC token, as the action does; see tunnel.yml. Pull
# requests from forks get no OIDC token, so they check paired hosts only. Every runner installs the Bazel release build
# of ovr (tunnel.yml's `build` job). Pull requests that only change Markdown skip it.
on:
  pull_request:
    paths-ignore: ["**/*.md", LICENSE]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tunnel:
    uses: ./.github/workflows/tunnel.yml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    with:
      kinds: ${{ github.event.pull_request.head.repo.fork && '["paired"]' || '["paired", "trusted"]' }}
      mode: check
