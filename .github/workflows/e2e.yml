name: E2E

# Checks that syncs and exit codes reach hosts on Linux, macOS, and Windows through a Cloudflare quick tunnel, both
# paired hosts and trusted ones that connect with the job's OIDC token, as the action does; see tunnel.yml. Pull
# requests from forks get no OIDC token, so they check paired hosts only. The nightly bench runs the same jobs on main,
# which refreshes the caches pull requests restore from.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tunnel:
    uses: ./.github/workflows/tunnel.yml
    with:
      kinds: ${{ github.event.pull_request.head.repo.fork && '["paired"]' || '["paired", "trusted"]' }}
      mode: check
