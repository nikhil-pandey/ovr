name: Tunnel e2e

# An initiator on one runner opens a Cloudflare quick tunnel; hosts on Linux, macOS, and Windows runners dial in
# through it, and the initiator syncs real repositories to each host and builds them there.
#
# Quick tunnel addresses are random, so the jobs meet through this run's artifacts: each host uploads a public key,
# the initiator answers with `ovrd connect` arguments encrypted to it, and uploads `finished` at the end.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - .github/workflows/tunnel-e2e.yml
      - .github/e2e/**

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  # renovate: datasource=github-releases depName=cloudflare/cloudflared
  CLOUDFLARED_VERSION: 2026.10.7

defaults:
  run:
    shell: bash

jobs:
  initiator:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: |
          cargo build --release --locked -p ovr -p ovrd
          echo "$GITHUB_WORKSPACE/target/release" >>"$GITHUB_PATH"
      - run: .github/e2e/install-cloudflared.sh
      - name: Clone the repositories to build
        run: |
          for repo in BurntSushi/ripgrep rust-lang/cargo tokio-rs/tokio bazelbuild/examples; do
            git clone --quiet --depth 1 "https://github.com/$repo" "$RUNNER_TEMP/repos/${repo#*/}" &
          done
          wait
          du -sh "$RUNNER_TEMP"/repos/*
      - name: Pair the hosts
        run: |
          # Every key first: a pairing code expires ten minutes after it is issued.
          for os in linux macos windows; do .github/e2e/await.sh "key-$os" "keys/$os" 1800; done
          mkdir pairs
          for os in linux macos windows; do
            read -r addr code < <(ovrd pair cloudflare | sed -n 's/^ *ovrd connect //p')
            [[ -n $code ]] || { echo "ovrd pair printed no connect command" >&2; exit 1; }
            printf '%s %s' "$addr" "$code" |
              openssl pkeyutl -encrypt -pubin -inkey "keys/$os/key.pub" -pkeyopt rsa_padding_mode:oaep -out "pairs/$os"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairs
          path: pairs
          retention-days: 1
      - name: Wait for the hosts to dial in
        run: |
          deadline=$((SECONDS + 600))
          until ovr hosts >hosts.txt &&
            grep -q ' online   linux/' hosts.txt && grep -q ' online   macos/' hosts.txt && grep -q ' online   windows/' hosts.txt; do
            ((SECONDS < deadline)) || { cat hosts.txt; exit 1; }
            sleep 5
          done
          cat hosts.txt
      - name: Sync and build on every host
        run: |
          declare -A pids
          mkdir logs
          for os in linux macos windows; do
            host=$(awk -v os="$os/" '$2 == "online" && index($3, os) == 1 { print $1 }' hosts.txt)
            .github/e2e/builds.sh "$host" "$RUNNER_TEMP/repos" "results-$os.md" >"logs/$os.log" 2>&1 &
            pids[$os]=$!
          done
          status=0
          for os in linux macos windows; do
            code=0
            wait "${pids[$os]}" || code=$?
            ((code == 0)) || status=1
            {
              echo "## $os host"
              printf '| Step | Time | Exit |\n|---|---|---|\n'
              cat "results-$os.md"
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::notice::$os host: $(wc -l <"results-$os.md") steps, exit $code"
          done
          for os in linux macos windows; do
            echo "=== $os ==="
            cat "logs/$os.log"
          done
          exit $status
      - if: always()
        name: Close the tunnel
        run: |
          mkdir -p finished && echo finished >finished/finished
          ovrd tunnel close cloudflare || true
          cat ~/.local/state/ovr/*.log || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finished
          path: finished
          retention-days: 1

  host:
    name: host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-26.04 }
          - { name: macos, os: macos-26 }
          - { name: windows, os: windows-2025-vs2026 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: |
          cargo build --release --locked -p ovrd
          echo "$GITHUB_WORKSPACE/target/release" >>"$GITHUB_PATH"
      - run: .github/e2e/install-cloudflared.sh
      - name: Make a key the initiator can encrypt to
        run: |
          mkdir -p "$RUNNER_TEMP/key" key
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/key/key.pem"
          openssl pkey -in "$RUNNER_TEMP/key/key.pem" -pubout -out key/key.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-${{ matrix.name }}
          path: key
          retention-days: 1
      - name: Serve the initiator until it is done
        run: |
          .github/e2e/await.sh pairs pairs 1800
          read -r addr code < <(openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/key/key.pem" \
            -pkeyopt rsa_padding_mode:oaep -in "pairs/${{ matrix.name }}")
          ovrd connect "$addr" "$code" --foreground >host.log 2>&1 &
          pid=$!
          code=0
          .github/e2e/await.sh finished finished 6000 "$pid" || code=$?
          kill "$pid" 2>/dev/null || true
          cat host.log
          exit $code
